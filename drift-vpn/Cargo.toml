[package]
name = "drift-vpn"
version = "0.17.0"
edition = "2021"
description = "Identity-routed multi-transport VPN built on DRIFT"

[dependencies]
drift = { path = "../drift" }
drift-core = { path = "../drift-core" }
# Shared inventory schema + file I/O. Lets `drift-vpn config gen`
# read the same `drift.toml` an operator manages with
# `drift-config`.
drift-config = { path = "../drift-config" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "fs", "signal", "process"] }
clap = { version = "4", features = ["derive"] }
# Shell completion generator. Used by `drift-vpn completions`
# to emit bash/zsh/fish/elvish/powershell scripts.
clap_complete = "4"
# Man page generator — `drift-vpn manpage` emits troff format
# for distro packaging. Pairs with `completions` above.
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
hex = "0.4"
ipnet = { version = "2", features = ["serde"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# x25519-dalek is already pulled in transitively via drift-core, but
# the rotate CLI uses it directly to derive a pubkey from a freshly-
# generated secret without round-tripping through `Identity`. Pin the
# same major version drift-core is on so we don't accidentally bring
# a second copy.
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tempfile = "3"

# v0.12: tun/utun via the same crate on Linux and macOS.
# Linux: /dev/net/tun. macOS: utun via utun_control. Same
# AsyncRead/AsyncWrite surface either way. Windows Wintun is
# also supported by the crate; we'll wire it up in a future
# release once the Windows-specific status-server (named
# pipe) is in place.
[target.'cfg(unix)'.dependencies]
tun = { version = "0.6", features = ["async"] }
# libc::geteuid is the only thing we touch; rest of the preflight
# uses /proc and /dev directly.
libc = "0.2"

[[bin]]
name = "drift-vpn"
path = "src/main.rs"
