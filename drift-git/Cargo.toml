[package]
name = "drift-git"
version = "0.1.0"
edition = "2021"
description = "Git remote helper + serving daemon over DRIFT — git push drift://<peerhex>/repo"

[dependencies]
drift = { path = "../drift" }
drift-core = { path = "../drift-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "net", "sync", "fs", "signal"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hex = "0.4"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"

[[bin]]
name = "drift-git-server"
path = "src/server.rs"

[[bin]]
name = "git-remote-drift"
path = "src/helper.rs"

[lib]
path = "src/lib.rs"
