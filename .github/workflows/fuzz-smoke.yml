name: fuzz-smoke

# Coverage-guided fuzz smoke. Runs every Tier-1 target for a
# bounded number of iterations on each PR so wire-format
# regressions get caught at review time, not nightly. Long-run
# fuzzing happens in `fuzz-nightly` (separate workflow on cron).
#
# Notes
#   * Linux uses the default AddressSanitizer build (catches OOB
#     reads in unsafe blocks like ecn.rs).
#   * No macOS job: the `inventory` crate (via wtransport) breaks
#     the ASan linker on aarch64-apple-darwin. Developers can
#     still run `cargo +nightly fuzz run --sanitizer none <t>`
#     locally on macOS.

on:
  pull_request:
    branches: [main]
    paths:
      - 'drift-core/**'
      - 'drift/src/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz-smoke.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: header_decode,                runs: 20000 }
          - { target: short_header_decode,          runs: 20000 }
          - { target: federated_envelope_decode,    runs: 20000 }
          - { target: federation_directory_decode,  runs: 20000 }
          - { target: directory_decode,             runs: 20000 }
          - { target: tcp_deframe,                  runs: 20000 }
          # stream_frame is heavier per-iter (Transport+StreamManager
          # state); fewer runs keeps the smoke job under ~2 min.
          - { target: stream_frame,                 runs: 5000 }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Regenerate seed corpus
        run: cargo run --example fuzz_seeds -p drift

      - name: Smoke ${{ matrix.target }}
        working-directory: .
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} \
            -- -runs=${{ matrix.runs }} -print_final_stats=1
