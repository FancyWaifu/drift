# End-to-end federation-pentagon test:
#
#                       bridge-b1
#                      /  |   |  \\
#                     /   |   |   \\
#                    /    |   |    \\
#               bridge-b5 |   |  bridge-b2
#                  | \\   |   |   / |
#                  |  \\  |   |  /  |
#                  |   \\ |   | /   |
#                  |    \\|   |/    |
#                  |   bridge-b3    |   <-- every bridge federated to
#                  |    /     \\    |       every other bridge (K5).
#                  |   /       \\   |       10 edges total.
#                  |  /         \\  |
#                  | /           \\ |
#               bridge-b4 ─────── (b3, also closes the K5)
#
# 5 bridges in a complete graph (K5): every pair federated via UDP.
# At each vertex we attach (server-sN, client-cN). Twenty cross-bridge
# dials cover every (c → s_remote) ordered pair. Verifies that
# federation directory propagation reaches every vertex at K5 scale
# (4× the federation peers per bridge vs. the triangle test) and that
# bridge-side forwarding fanout doesn't introduce ordering bugs.
#
# Image is reused from docker/federation-discovery/Dockerfile (same
# tools: drift, drift-mosh-server, drift-mosh-client, drift-config).
#
# Subnet 10.55.0.0/24 (triangle uses 172.31.0.0/24 — distinct so the
# two tests can coexist).

x-base-build: &base-build
  build:
    context: ../..
    dockerfile: docker/federation-discovery/Dockerfile

services:
  # ─── 5 BRIDGES ───────────────────────────────────────────────────
  # Each bridge federates to the other four. Federation list is
  # symmetric — operationally equivalent to a router-bgp full-mesh.
  bridge-b1:
    <<: *base-build
    container_name: pent-bridge-b1
    networks:
      pentnet:
        ipv4_address: 10.55.0.11
    environment: { RUST_LOG: "info,drift=info" }
    volumes: [ "./identities:/identities:ro" ]
    command: >
      drift --identity /identities/b1.key bridge
        --listen udp://0.0.0.0:51820
        --listen h2s://0.0.0.0:51827
        --federate h2s://10.55.0.12:51827@${PUB_B2}
        --federate h2s://10.55.0.13:51827@${PUB_B3}
        --federate h2s://10.55.0.14:51827@${PUB_B4}
        --federate h2s://10.55.0.15:51827@${PUB_B5}

  bridge-b2:
    <<: *base-build
    container_name: pent-bridge-b2
    networks:
      pentnet:
        ipv4_address: 10.55.0.12
    environment: { RUST_LOG: "info,drift=info" }
    volumes: [ "./identities:/identities:ro" ]
    command: >
      drift --identity /identities/b2.key bridge
        --listen udp://0.0.0.0:51820
        --listen h2s://0.0.0.0:51827
        --federate h2s://10.55.0.11:51827@${PUB_B1}
        --federate h2s://10.55.0.13:51827@${PUB_B3}
        --federate h2s://10.55.0.14:51827@${PUB_B4}
        --federate h2s://10.55.0.15:51827@${PUB_B5}

  bridge-b3:
    <<: *base-build
    container_name: pent-bridge-b3
    networks:
      pentnet:
        ipv4_address: 10.55.0.13
    environment: { RUST_LOG: "info,drift=info" }
    volumes: [ "./identities:/identities:ro" ]
    command: >
      drift --identity /identities/b3.key bridge
        --listen udp://0.0.0.0:51820
        --listen h2s://0.0.0.0:51827
        --federate h2s://10.55.0.11:51827@${PUB_B1}
        --federate h2s://10.55.0.12:51827@${PUB_B2}
        --federate h2s://10.55.0.14:51827@${PUB_B4}
        --federate h2s://10.55.0.15:51827@${PUB_B5}

  bridge-b4:
    <<: *base-build
    container_name: pent-bridge-b4
    networks:
      pentnet:
        ipv4_address: 10.55.0.14
    environment: { RUST_LOG: "info,drift=info" }
    volumes: [ "./identities:/identities:ro" ]
    command: >
      drift --identity /identities/b4.key bridge
        --listen udp://0.0.0.0:51820
        --listen h2s://0.0.0.0:51827
        --federate h2s://10.55.0.11:51827@${PUB_B1}
        --federate h2s://10.55.0.12:51827@${PUB_B2}
        --federate h2s://10.55.0.13:51827@${PUB_B3}
        --federate h2s://10.55.0.15:51827@${PUB_B5}

  bridge-b5:
    <<: *base-build
    container_name: pent-bridge-b5
    networks:
      pentnet:
        ipv4_address: 10.55.0.15
    environment: { RUST_LOG: "info,drift=info" }
    volumes: [ "./identities:/identities:ro" ]
    command: >
      drift --identity /identities/b5.key bridge
        --listen udp://0.0.0.0:51820
        --listen h2s://0.0.0.0:51827
        --federate h2s://10.55.0.11:51827@${PUB_B1}
        --federate h2s://10.55.0.12:51827@${PUB_B2}
        --federate h2s://10.55.0.13:51827@${PUB_B3}
        --federate h2s://10.55.0.14:51827@${PUB_B4}

  # ─── 5 SERVERS ───────────────────────────────────────────────────
  # Each on a different bridge. Servers know ONLY their on-ramp.
  server-s1:
    <<: *base-build
    container_name: pent-server-s1
    depends_on: [ bridge-b1 ]
    networks: { pentnet: { ipv4_address: 10.55.0.21 } }
    environment: { RUST_LOG: "info,drift_mosh_server=info" }
    volumes: [ "./identities:/identities:ro" ]
    command: >
      drift-mosh-server
        --identity-file /identities/s1.hex
        --bridge udp://10.55.0.11:51820@${PUB_B1}
        --shell /bin/sh

  server-s2:
    <<: *base-build
    container_name: pent-server-s2
    depends_on: [ bridge-b2 ]
    networks: { pentnet: { ipv4_address: 10.55.0.22 } }
    environment: { RUST_LOG: "info,drift_mosh_server=info" }
    volumes: [ "./identities:/identities:ro" ]
    command: >
      drift-mosh-server
        --identity-file /identities/s2.hex
        --bridge udp://10.55.0.12:51820@${PUB_B2}
        --shell /bin/sh

  server-s3:
    <<: *base-build
    container_name: pent-server-s3
    depends_on: [ bridge-b3 ]
    networks: { pentnet: { ipv4_address: 10.55.0.23 } }
    environment: { RUST_LOG: "info,drift_mosh_server=info" }
    volumes: [ "./identities:/identities:ro" ]
    command: >
      drift-mosh-server
        --identity-file /identities/s3.hex
        --bridge udp://10.55.0.13:51820@${PUB_B3}
        --shell /bin/sh

  server-s4:
    <<: *base-build
    container_name: pent-server-s4
    depends_on: [ bridge-b4 ]
    networks: { pentnet: { ipv4_address: 10.55.0.24 } }
    environment: { RUST_LOG: "info,drift_mosh_server=info" }
    volumes: [ "./identities:/identities:ro" ]
    command: >
      drift-mosh-server
        --identity-file /identities/s4.hex
        --bridge udp://10.55.0.14:51820@${PUB_B4}
        --shell /bin/sh

  server-s5:
    <<: *base-build
    container_name: pent-server-s5
    depends_on: [ bridge-b5 ]
    networks: { pentnet: { ipv4_address: 10.55.0.25 } }
    environment: { RUST_LOG: "info,drift_mosh_server=info" }
    volumes: [ "./identities:/identities:ro" ]
    command: >
      drift-mosh-server
        --identity-file /identities/s5.hex
        --bridge udp://10.55.0.15:51820@${PUB_B5}
        --shell /bin/sh

  # ─── 5 CLIENTS ───────────────────────────────────────────────────
  # Each pinned to its local bridge in inventory; reaches remote
  # servers through federation directory propagation only.
  client-c1:
    <<: *base-build
    container_name: pent-client-c1
    depends_on: [ server-s1, server-s2, server-s3, server-s4, server-s5 ]
    networks: { pentnet: { ipv4_address: 10.55.0.31 } }
    volumes:
      - "./identities:/identities:ro"
      - "./inventory-c1:/etc/drift:ro"
    command: ["sleep", "infinity"]

  client-c2:
    <<: *base-build
    container_name: pent-client-c2
    depends_on: [ server-s1, server-s2, server-s3, server-s4, server-s5 ]
    networks: { pentnet: { ipv4_address: 10.55.0.32 } }
    volumes:
      - "./identities:/identities:ro"
      - "./inventory-c2:/etc/drift:ro"
    command: ["sleep", "infinity"]

  client-c3:
    <<: *base-build
    container_name: pent-client-c3
    depends_on: [ server-s1, server-s2, server-s3, server-s4, server-s5 ]
    networks: { pentnet: { ipv4_address: 10.55.0.33 } }
    volumes:
      - "./identities:/identities:ro"
      - "./inventory-c3:/etc/drift:ro"
    command: ["sleep", "infinity"]

  client-c4:
    <<: *base-build
    container_name: pent-client-c4
    depends_on: [ server-s1, server-s2, server-s3, server-s4, server-s5 ]
    networks: { pentnet: { ipv4_address: 10.55.0.34 } }
    volumes:
      - "./identities:/identities:ro"
      - "./inventory-c4:/etc/drift:ro"
    command: ["sleep", "infinity"]

  client-c5:
    <<: *base-build
    container_name: pent-client-c5
    depends_on: [ server-s1, server-s2, server-s3, server-s4, server-s5 ]
    networks: { pentnet: { ipv4_address: 10.55.0.35 } }
    volumes:
      - "./identities:/identities:ro"
      - "./inventory-c5:/etc/drift:ro"
    command: ["sleep", "infinity"]

networks:
  pentnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.55.0.0/24
