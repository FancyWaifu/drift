# End-to-end federation-triangle test:
#
#         bridge-b1  ──────────── bridge-b2
#              \\                  //
#               \\                //
#                \\              //
#                 \\            //
#                   bridge-b3
#
# Three bridges fully federated (every pair: --federate). At each
# vertex N we attach a (server-sN, client-cN) pair so we can dial
# each direction:
#   C1 → S2, C1 → S3, C2 → S1, C2 → S3, C3 → S1, C3 → S2.
#
# Each client knows ONLY its on-ramp bridge in drift.toml
# (default_bridge = local-bridge). Directory propagation must
# resolve every other vertex.
#
# Reuses docker/federation-discovery/Dockerfile (same binary set:
# drift, drift-mosh-server, drift-mosh-client, drift-config).

services:
  bridge-b1:
    build:
      context: ../..
      dockerfile: docker/federation-discovery/Dockerfile
    container_name: tri-bridge-b1
    networks:
      trinet:
        ipv4_address: 172.31.0.12
    environment:
      RUST_LOG: "info,drift=info"
    volumes:
      - ./identities:/identities:ro
    command: >
      drift --identity /identities/b1.key bridge
        --listen udp://0.0.0.0:51820
        --listen h2s://0.0.0.0:51827
        --federate h2s://172.31.0.13:51827@${PUB_B2}
        --federate h2s://172.31.0.14:51827@${PUB_B3}

  bridge-b2:
    build:
      context: ../..
      dockerfile: docker/federation-discovery/Dockerfile
    container_name: tri-bridge-b2
    networks:
      trinet:
        ipv4_address: 172.31.0.13
    environment:
      RUST_LOG: "info,drift=info"
    volumes:
      - ./identities:/identities:ro
    command: >
      drift --identity /identities/b2.key bridge
        --listen udp://0.0.0.0:51820
        --listen h2s://0.0.0.0:51827
        --federate h2s://172.31.0.12:51827@${PUB_B1}
        --federate h2s://172.31.0.14:51827@${PUB_B3}

  bridge-b3:
    build:
      context: ../..
      dockerfile: docker/federation-discovery/Dockerfile
    container_name: tri-bridge-b3
    networks:
      trinet:
        ipv4_address: 172.31.0.14
    environment:
      RUST_LOG: "info,drift=info"
    volumes:
      - ./identities:/identities:ro
    command: >
      drift --identity /identities/b3.key bridge
        --listen udp://0.0.0.0:51820
        --listen h2s://0.0.0.0:51827
        --federate h2s://172.31.0.12:51827@${PUB_B1}
        --federate h2s://172.31.0.13:51827@${PUB_B2}

  server-s1:
    build:
      context: ../..
      dockerfile: docker/federation-discovery/Dockerfile
    container_name: tri-server-s1
    depends_on:
      - bridge-b1
    networks:
      trinet:
        ipv4_address: 172.31.0.21
    environment:
      RUST_LOG: "info,drift_mosh_server=info"
    volumes:
      - ./identities:/identities:ro
    command: >
      drift-mosh-server
        --identity-file /identities/s1.hex
        --bridge udp://172.31.0.12:51820@${PUB_B1}
        --shell /bin/sh

  server-s2:
    build:
      context: ../..
      dockerfile: docker/federation-discovery/Dockerfile
    container_name: tri-server-s2
    depends_on:
      - bridge-b2
    networks:
      trinet:
        ipv4_address: 172.31.0.22
    environment:
      RUST_LOG: "info,drift_mosh_server=info"
    volumes:
      - ./identities:/identities:ro
    command: >
      drift-mosh-server
        --identity-file /identities/s2.hex
        --bridge udp://172.31.0.13:51820@${PUB_B2}
        --shell /bin/sh

  server-s3:
    build:
      context: ../..
      dockerfile: docker/federation-discovery/Dockerfile
    container_name: tri-server-s3
    depends_on:
      - bridge-b3
    networks:
      trinet:
        ipv4_address: 172.31.0.23
    environment:
      RUST_LOG: "info,drift_mosh_server=info"
    volumes:
      - ./identities:/identities:ro
    command: >
      drift-mosh-server
        --identity-file /identities/s3.hex
        --bridge udp://172.31.0.14:51820@${PUB_B3}
        --shell /bin/sh

  client-c1:
    build:
      context: ../..
      dockerfile: docker/federation-discovery/Dockerfile
    container_name: tri-client-c1
    depends_on:
      - server-s1
      - server-s2
      - server-s3
    networks:
      trinet:
        ipv4_address: 172.31.0.31
    volumes:
      - ./identities:/identities:ro
      - ./inventory-c1:/etc/drift:ro
    command: ["sleep", "infinity"]

  client-c2:
    build:
      context: ../..
      dockerfile: docker/federation-discovery/Dockerfile
    container_name: tri-client-c2
    depends_on:
      - server-s1
      - server-s2
      - server-s3
    networks:
      trinet:
        ipv4_address: 172.31.0.32
    volumes:
      - ./identities:/identities:ro
      - ./inventory-c2:/etc/drift:ro
    command: ["sleep", "infinity"]

  client-c3:
    build:
      context: ../..
      dockerfile: docker/federation-discovery/Dockerfile
    container_name: tri-client-c3
    depends_on:
      - server-s1
      - server-s2
      - server-s3
    networks:
      trinet:
        ipv4_address: 172.31.0.33
    volumes:
      - ./identities:/identities:ro
      - ./inventory-c3:/etc/drift:ro
    command: ["sleep", "infinity"]

networks:
  trinet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
