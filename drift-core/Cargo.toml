[package]
name = "drift-core"
version = "0.1.0"
edition = "2021"
description = "Platform-independent DRIFT protocol primitives"

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
# XEdDSA presence-ticket signing/verification on the existing
# Curve25519 identity keys. `curve25519-dalek` for Edwards-point
# and scalar arithmetic, `sha2` for the SHA-512 inside the
# Signal XEdDSA construction (intentionally per-spec rather
# than substituting BLAKE2b — keeps the security claim crisp
# and lets future reviewers cross-check against the spec).
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "digest", "zeroize"] }
sha2 = "0.10"
# Wraps derived session keys / rekey outputs in
# `Zeroizing<[u8; 32]>` so stack copies of key bytes get
# scrubbed at end of scope. Long-term `Identity` keys zero via
# x25519-dalek's `zeroize` feature above.
zeroize = { version = "1", features = ["derive"] }
blake2 = "0.10"
siphasher = "1"
ml-kem = "0.2"
rand = "0.8"
thiserror = "1"
tracing = "0.1"

# ring's AEAD implementation is ~2× faster than the RustCrypto
# `chacha20poly1305` crate on Apple Silicon (measured via the
# aead_head_to_head bench). Ring supports every native target
# we care about, but not `wasm32-unknown-unknown` — so wasm
# keeps using `chacha20poly1305` as a pure-Rust fallback. Same
# wire format on both backends: IETF ChaCha20-Poly1305 is a
# standard, not an implementation detail.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ring = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
chacha20poly1305 = "0.10"
getrandom = { version = "0.2", features = ["js"] }
web-time = "1"

[dev-dependencies]
proptest = "1"
