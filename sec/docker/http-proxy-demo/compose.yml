# End-to-end demo: caddy reverse proxy → drift bridge → drift peer.
# Proves that a drift http:// session completes through a real
# HTTP-1.1 reverse proxy.
#
# Topology:
#   client (probe, 10.98.0.30)
#       │  http://caddy:8080/drift-sse + /drift-send
#       ▼
#   caddy (10.98.0.20)
#       │  http://drift-bridge:51820
#       ▼
#   drift-bridge (10.98.0.10), --trust-proxy-headers
#
# Run:
#   bash sec/docker/http-proxy-demo/run.sh
#
# The run.sh wrapper handles keygen, env vars, and exit-code
# assertion. Direct compose use:
#
#   cd sec/docker/http-proxy-demo
#   docker compose -f compose.yml up --abort-on-container-exit \
#       --exit-code-from probe
#
# probe exits 0 → demo PASS.

services:
  drift-bridge:
    image: drift-sec:latest
    container_name: http-proxy-demo-bridge
    networks: { proxynet: { ipv4_address: 10.98.0.10 } }
    volumes: [./keys:/keys:ro]
    environment:
      RUST_LOG: "info,drift::wire_http=debug"
    command:
      - drift
      - --identity
      - /keys/bridge.key
      - bridge
      - --listen
      - http://0.0.0.0:51820
      - --trust-proxy-headers

  caddy:
    image: caddy:2-alpine
    container_name: http-proxy-demo-caddy
    depends_on: [drift-bridge]
    networks: { proxynet: { ipv4_address: 10.98.0.20 } }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]

  probe:
    image: drift-sec:latest
    container_name: http-proxy-demo-probe
    depends_on: [caddy]
    networks: { proxynet: { ipv4_address: 10.98.0.30 } }
    volumes: [./keys:/keys:ro]
    environment:
      RUST_LOG: "info,drift=info"
      DRIFT_URL: "http://caddy:8080"
      # Set by run.sh from `drift info` on the bridge key.
      DRIFT_BRIDGE_PUB: "${DRIFT_BRIDGE_PUB}"
    command:
      - sh
      - -c
      - |
        # Give caddy a moment to wire up its reverse proxy.
        sleep 3
        http-probe

networks:
  proxynet:
    driver: bridge
    ipam: { config: [{ subnet: 10.98.0.0/24 }] }
