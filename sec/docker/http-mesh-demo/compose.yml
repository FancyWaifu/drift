# http+mesh demo: a "client machine" runs a drift http node
# fronted by caddy AND is reachable from the wider mesh through
# a remote bridge it federates with.
#
# Topology:
#
#   remote-sender (10.97.0.40)
#       │  drift over UDP
#       ▼
#   remote-bridge (10.97.0.20)                            ───┐
#       ◀──── federation (UDP) ───── client-node (10.97.0.10) │
#                                          ▲                  │
#                                          │ http://          │
#                                       caddy (10.97.0.30)   │  ALSO listening on
#                                          ▲                  │  http:// behind caddy
#                                          │ http://          │
#                                       (any web client) ─────┘
#
# client-node:
#   - is a drift node that listens on http://0.0.0.0:51820
#     (fronted by caddy on the same compose network)
#   - federates outbound to remote-bridge via UDP
#   - drains its own recv(), exits 0 on receipt of the magic
#     payload
#
# remote-sender:
#   - connects to remote-bridge via UDP
#   - sends a packet addressed to client-node's pubkey
#   - the bridge's mesh routing forwards over the federation
#     link to client-node
#
# Run:    bash sec/docker/http-mesh-demo/run.sh

services:
  remote-bridge:
    image: drift-sec:latest
    container_name: http-mesh-demo-bridge
    networks: { meshnet: { ipv4_address: 10.97.0.20 } }
    volumes: [./keys:/keys:ro]
    environment:
      RUST_LOG: "info,drift::transport::mesh=debug"
    command:
      - drift
      - --identity
      - /keys/bridge.key
      - bridge
      - --listen
      - udp://0.0.0.0:51820

  client-node:
    image: drift-sec:latest
    container_name: http-mesh-demo-client
    depends_on: [remote-bridge]
    networks: { meshnet: { ipv4_address: 10.97.0.10 } }
    volumes: [./keys:/keys:ro]
    environment:
      RUST_LOG: "info,drift::transport::mesh=debug,drift::wire_http=info"
      LISTEN_URL: "http://0.0.0.0:51820"
      IDENTITY_FILE: "/keys/client.key"
      BRIDGE_URL: "udp://remote-bridge:51820"
      BRIDGE_PUB: "${DRIFT_BRIDGE_PUB}"
      MAGIC: "HTTP-MESH-DEMO"
      TIMEOUT_SECS: "30"
    command:
      - sh
      - -c
      - |
        sleep 2  # let the bridge bind first
        mesh-listener

  caddy:
    image: caddy:2-alpine
    container_name: http-mesh-demo-caddy
    depends_on: [client-node]
    networks: { meshnet: { ipv4_address: 10.97.0.30 } }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]

  remote-sender:
    image: drift-sec:latest
    container_name: http-mesh-demo-sender
    depends_on: [client-node, caddy]
    networks: { meshnet: { ipv4_address: 10.97.0.40 } }
    environment:
      RUST_LOG: "info,drift::transport::mesh=debug"
      BRIDGE_URL: "udp://remote-bridge:51820"
      BRIDGE_PUB: "${DRIFT_BRIDGE_PUB}"
      TARGET_PUB: "${DRIFT_CLIENT_PUB}"
      MAGIC: "HTTP-MESH-DEMO"
      TRIES: "30"
    command:
      - sh
      - -c
      - |
        # Give client-node a moment to federate so the bridge
        # has a route to client-node's pubkey before we send.
        sleep 6
        mesh-sender

networks:
  meshnet:
    driver: bridge
    ipam: { config: [{ subnet: 10.97.0.0/24 }] }
