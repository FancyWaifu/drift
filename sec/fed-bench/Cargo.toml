[package]
name = "fed-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Per-wire-scheme throughput probe for drift. Single binary, two modes (listen / send). Drives one drift session at max rate for N seconds, reports MB/s. Used to compare bridge-to-bridge federation across udp / tcp / tls / h2 / h2s / webtransport."

[dependencies]
drift = { path = "../../drift" }
drift-core = { path = "../../drift-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
hex = "0.4"
anyhow = "1"
