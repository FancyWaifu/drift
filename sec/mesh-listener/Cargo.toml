[package]
name = "mesh-listener"
version = "0.1.0"
edition = "2021"
publish = false
description = "The 'client machine' side of the http+mesh demo. Listens on a configurable URL (typically http://), federates outbound to a remote bridge, and drains its own recv channel waiting for the magic payload. Exits 0 on receipt, 1 on timeout."

[dependencies]
drift = { path = "../../drift" }
drift-core = { path = "../../drift-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
hex = "0.4"
anyhow = "1"
