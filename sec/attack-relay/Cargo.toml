[package]
name = "attack-relay"
version = "0.1.0"
edition = "2021"
publish = false
description = "Security testbed binary — NOT for production. Demonstrates the open-relay vulnerability in drift bridge by sending unauthenticated DRIFT packets with an attacker-chosen dst_id."

[dependencies]
drift-core = { path = "../../drift-core" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time"] }
hex = "0.4"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
